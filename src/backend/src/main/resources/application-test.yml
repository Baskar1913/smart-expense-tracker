spring:
  datasource:
    url: jdbc:h2:mem:expense_tracker_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
  h2:
    console:
      enabled: false

app:
  cors:
    allowed-origin: http://localhost:5173
  jwt:
    secret: c21hcnQtZXhwZW5zZS10cmFja2VyLXRlc3Qtc2VjcmV0LWtleS1sb25nLWVub3VnaC0yMDI2
    access-expiration-seconds: 900
    refresh-expiration-seconds: 604800
    revocation-cleanup-ms: 3600000
  password-reset:
    expiration-seconds: 600
  security:
    login-rate-limit:
      max-failures: 5
      window-seconds: 600

logging:
  level:
    root: WARN
    com.example.expensetracker: INFO
