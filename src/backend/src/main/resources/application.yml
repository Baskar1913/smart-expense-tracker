server:
  port: 8080

spring:
  application:
    name: smart-expense-tracker
  datasource:
    url: ${DB_URL:jdbc:h2:file:./src/backend/data/expense_tracker}
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

app:
  cors:
    allowed-origin: ${FRONTEND_ORIGIN:http://localhost:5173}
  jwt:
    secret: ${JWT_SECRET:c21hcnQtZXhwZW5zZS10cmFja2VyLWRldmVsb3BtZW50LXNlY3JldC1rZXktbXVzdC1iZS1sb25nLWVub3VnaC0yMDI2}
    access-expiration-seconds: 900
    refresh-expiration-seconds: 604800
    revocation-cleanup-ms: 3600000
  password-reset:
    expiration-seconds: 600
  security:
    login-rate-limit:
      max-failures: 5
      window-seconds: 600

logging:
  level:
    root: INFO
    com.example.expensetracker: DEBUG
    org.springframework.security: INFO	
